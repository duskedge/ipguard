# ipguard 域名级访问网关(由 setup.sh --with-ipguard 追加到 server_proxy.conf 末尾)
# __IPGUARD_HOST__ 由 setup.sh 替换为 SHIM_IP(npm-guard 经 shim 访问宿主上的 ipguard:28090)

auth_request /_ipguard_auth;

location = /_ipguard_auth {
    internal;
    auth_request off;
    include /data/nginx/custom/ipguard_gate.conf;
    proxy_pass http://__IPGUARD_HOST__:28090/api/guard/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Request $request;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 =200 @ipguard_fail_open;   # ipguard 不可达时放行(fail-open)
}

location @ipguard_fail_open {
    internal;
    auth_request off;
    return 200;
}
